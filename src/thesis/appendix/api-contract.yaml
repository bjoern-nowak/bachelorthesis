openapi: 3.0.2
info:
  title: FastAPI
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /:
    get:
      tags:
        - root
      summary: Index
      operationId: index__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /hero/validate:
    post:
      tags:
        - hero
      summary: Validate
      operationId: validate_hero_validate_post
      parameters:
        - required: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Rulebook'
          name: rulebooks
          in: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hero'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeroValidationResult'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /meta/list:
    get:
      tags:
        - meta
      summary: List Feature
      description: Get list of possible values for a feature under given context (like
        active rulebooks).
      operationId: list_feature_meta_list_get
      parameters:
        - required: true
          schema:
            $ref: '#/components/schemas/Feature'
          name: feature
          in: query
        - required: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Rulebook'
          name: rulebooks
          in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response List Feature Meta List Get
                anyOf:
                  - type: array
                    items:
                      type: string
                  - $ref: '#/components/schemas/ClientError'
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ClientError:
      title: ClientError
      required:
        - detail
      type: object
      properties:
        detail:
          title: Detail
          anyOf:
            - type: string
            - $ref: '#/components/schemas/ExceptionDetails'
      additionalProperties: false
    ExceptionDetails:
      title: ExceptionDetails
      required:
        - type
        - message
      type: object
      properties:
        type:
          title: Type
          type: string
        message:
          title: Message
          type: string
      additionalProperties: false
    Feature:
      title: Feature
      enum:
        - Species
        - Culture
        - Profession
        - Advantage
        - Disadvantage
        - Skill
      type: string
      description: An enumeration.
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      properties:
        detail:
          title: Detail
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    Hero:
      title: Hero
      required:
        - name
        - species
        - culture
        - profession
      type: object
      properties:
        name:
          title: Name
          type: string
        species:
          title: Species
          type: string
        culture:
          title: Culture
          type: string
        profession:
          title: Profession
          type: string
      additionalProperties: false
    HeroValidationResult:
      title: HeroValidationResult
      required:
        - valid
        - errors
      type: object
      properties:
        valid:
          title: Valid
          type: boolean
        errors:
          title: Errors
          type: array
          items:
            type: string
      additionalProperties: false
    Rulebook:
      title: Rulebook
      enum:
        - dsa5
        - dsa5_expansion
        - dsa5_expansion2
      type: string
      description: An enumeration.
    ServerError:
      title: ServerError
      required:
        - detail
      type: object
      properties:
        detail:
          title: Detail
          anyOf:
            - type: string
            - $ref: '#/components/schemas/ExceptionDetails'
      additionalProperties: false
    ValidationError:
      title: ValidationError
      required:
        - loc
        - msg
        - type
      type: object
      properties:
        loc:
          title: Location
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string